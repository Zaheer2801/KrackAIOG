<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KrackAI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      -webkit-app-region: drag;
      user-select: none;
    }

    .stage {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0f0c29 0%, #1a0938 40%, #0f172a 100%);
      border-radius: 24px;
      position: relative;
      overflow: hidden;
    }

    /* ── background shimmer rings ── */
    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(99, 102, 241, 0.15);
      animation: ringPulse 3s ease-in-out infinite;
    }
    .ring-1 { width: 320px; height: 320px; animation-delay: 0s; }
    .ring-2 { width: 440px; height: 440px; animation-delay: 0.6s; opacity: 0.6; }
    .ring-3 { width: 560px; height: 560px; animation-delay: 1.2s; opacity: 0.3; }
    @keyframes ringPulse {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50%       { transform: scale(1.05); opacity: 0.15; }
    }

    /* ── character wrapper ── */
    .char-wrap {
      position: relative; z-index: 10;
      animation: spinIn 1.1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      opacity: 0;
    }
    @keyframes spinIn {
      0%   { opacity: 0; transform: rotate(-540deg) scale(0.1); }
      60%  { opacity: 1; transform: rotate(20deg) scale(1.08); }
      80%  { transform: rotate(-8deg) scale(0.97); }
      100% { opacity: 1; transform: rotate(0deg) scale(1); }
    }

    /* slight float after spin */
    .char-wrap.settled {
      animation: spinIn 1.1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
                 float 3s ease-in-out 1.1s infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50%       { transform: translateY(-8px) rotate(1.5deg); }
    }

    /* ── brand text ── */
    .brand {
      position: relative; z-index: 10;
      margin-top: 28px;
      opacity: 0;
      animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 1.3s forwards;
      text-align: center;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .brand-name {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: -2px;
      background: linear-gradient(90deg, #ffffff 0%, #a5b4fc 50%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      background-size: 200% 100%;
      animation: shimmer 2s ease-in-out 1.8s infinite;
    }
    @keyframes shimmer {
      0%   { background-position: 200% center; }
      100% { background-position: -200% center; }
    }

    .brand-sub {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(165, 180, 252, 0.7);
      margin-top: 6px;
    }

    /* ── loading dots ── */
    .dots {
      margin-top: 32px;
      display: flex; gap: 8px;
      opacity: 0;
      animation: fadeUp 0.5s ease 1.7s forwards;
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(99, 102, 241, 0.6);
      animation: dotBounce 1.2s ease-in-out infinite;
    }
    .dot:nth-child(1) { animation-delay: 0s; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotBounce {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; background: rgba(99,102,241,0.5); }
      40%           { transform: scale(1.3); opacity: 1;   background: #6366f1; }
    }

    /* ── exit fade ── */
    body.exit .stage {
      animation: fadeOut 0.5s ease forwards;
    }
    @keyframes fadeOut {
      to { opacity: 0; transform: scale(1.04); }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>
    <div class="ring ring-3"></div>

    <!-- Geometric bauhaus character -->
    <div class="char-wrap" id="charWrap">
      <svg viewBox="0 0 200 290" width="180" height="261" xmlns="http://www.w3.org/2000/svg">

        <!-- Antenna line -->
        <line x1="112" y1="52" x2="130" y2="14" stroke="rgba(255,255,255,0.55)" stroke-width="1.5" stroke-linecap="round"/>
        <!-- Antenna dot -->
        <circle cx="131" cy="12" r="5.5" fill="#EF4444"/>

        <!-- Head dome (dark indigo arch) -->
        <path d="M58 95 A42 42 0 0 1 142 95 Z" fill="#1e1b4b"/>

        <!-- Face backing white rect -->
        <rect x="62" y="68" width="76" height="47" rx="2" fill="#f8fafc"/>
        <!-- Red upper arc over face -->
        <path d="M62 68 A38 22 0 0 1 138 68 Z" fill="#EF4444"/>
        <!-- Yellow left face panel -->
        <rect x="62" y="68" width="36" height="47" fill="#FCD34D"/>
        <!-- Eye white circle -->
        <circle cx="89" cy="86" r="13" fill="#ffffff"/>
        <!-- Eye blue iris -->
        <circle cx="89" cy="86" r="8" fill="#3B82F6"/>
        <!-- Eye pupil -->
        <circle cx="87" cy="84" r="4" fill="#1e1b4b"/>
        <!-- Eye shine -->
        <circle cx="91" cy="81" r="2" fill="#ffffff"/>

        <!-- Neck connector -->
        <rect x="84" y="113" width="32" height="8" fill="#94a3b8"/>

        <!-- Body main rect -->
        <rect x="56" y="121" width="88" height="82" fill="#f8fafc"/>
        <!-- Body left dark panel -->
        <rect x="56" y="121" width="22" height="82" fill="#1e1b4b"/>
        <!-- Body right dark panel -->
        <rect x="122" y="121" width="22" height="82" fill="#1e1b4b"/>

        <!-- Belly hot-pink dome -->
        <path d="M56 163 A44 33 0 0 0 144 163 Z" fill="#EC4899"/>
        <!-- Belly inner glow -->
        <path d="M70 163 A30 22 0 0 0 130 163 Z" fill="rgba(249,115,22,0.45)"/>

        <!-- Indigo triangle (pointing up) -->
        <polygon points="100,148 78,178 122,178" fill="#6366F1"/>
        <!-- Gold right triangle -->
        <polygon points="100,148 122,178 100,195" fill="#FCD34D"/>

        <!-- Center gray box -->
        <rect x="82" y="178" width="36" height="34" fill="#94a3b8"/>
        <!-- Red circle center -->
        <circle cx="100" cy="195" r="13" fill="#EF4444"/>

        <!-- Yellow flame teardrop -->
        <path d="M91 215 Q100 258 100 268 Q100 258 109 215 Z" fill="#FCD34D"/>
        <!-- Flame red center line -->
        <line x1="100" y1="215" x2="100" y2="269" stroke="#EF4444" stroke-width="1.2" stroke-linecap="round"/>

        <!-- Leg white strings -->
        <line x1="83"  y1="215" x2="83"  y2="244" stroke="rgba(255,255,255,0.35)" stroke-width="1.2"/>
        <line x1="117" y1="215" x2="117" y2="244" stroke="rgba(255,255,255,0.35)" stroke-width="1.2"/>

        <!-- Foot circles (dark indigo) -->
        <circle cx="83"  cy="246" r="7.5" fill="#1e1b4b"/>
        <circle cx="117" cy="246" r="7.5" fill="#1e1b4b"/>
        <!-- Foot highlight -->
        <circle cx="81"  cy="244" r="2.5" fill="rgba(255,255,255,0.3)"/>
        <circle cx="115" cy="244" r="2.5" fill="rgba(255,255,255,0.3)"/>

        <!-- Base rectangle -->
        <rect x="82" y="256" width="36" height="11" rx="4" fill="#3B82F6"/>

      </svg>
    </div>

    <div class="brand">
      <div class="brand-name">KrackAI</div>
      <div class="brand-sub">Your Interview Co-Pilot</div>
    </div>

    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <script>
    // Add float animation after spin settles
    setTimeout(() => {
      document.getElementById('charWrap').classList.add('settled');
    }, 1100);

    // Signal main process to close splash and show main window
    setTimeout(() => {
      document.body.classList.add('exit');
      setTimeout(() => {
        if (window.splashAPI) window.splashAPI.ready();
      }, 480);
    }, 2600);
  </script>
</body>
</html>
