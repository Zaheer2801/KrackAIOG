<div class="min-h-screen w-full bg-gray-900/50 backdrop-blur-lg flex flex-col p-4">
    <!-- Back Button -->
    <div class="p-2">
        <app-back></app-back>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex items-center justify-center p-4">
        <div class="w-full max-w-md">

            <!-- Success Message -->
            <div *ngIf="isSubmitted"
                class="bg-gray-800/30 backdrop-blur-sm rounded-2xl p-6 border border-cyan-400/30 text-center animate-fade-in">
                <svg class="w-16 h-16 text-cyan-400 mx-auto mb-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>

                <h2 class="text-xl sm:text-2xl font-semibold text-white mb-3">Thank You!</h2>
                <p class="text-gray-300 mb-2">Your message has been sent successfully.</p>
                <p class="text-cyan-400 font-medium mb-6">Our support team will get back to you soon.</p>

                <div class="flex flex-col sm:flex-row gap-4 justify-center">
                    <button (click)="resetForm()"
                        class="px-6 py-3 bg-cyan-400 hover:bg-cyan-300 text-black font-bold rounded-xl transition-all">
                        Send Another Message
                    </button>

                    <a routerLink="/dashboard"
                        class="px-6 py-3 bg-gray-700 hover:bg-gray-600 text-white font-bold rounded-xl transition-all text-center">
                        Go Home
                    </a>
                </div>
            </div>

            <!-- Support Form -->
            <div *ngIf="!isSubmitted" class="bg-gray-800/60 backdrop-blur-sm rounded-2xl p-6 border border-gray-700/30">
                <form [formGroup]="supportForm" (ngSubmit)="submitSupportRequest()" class="space-y-5">

                    <!-- Name -->
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1.5">Name</label>
                        <input formControlName="name" type="text" placeholder="Your full name"
                            class="w-full px-4 py-2.5 bg-gray-700/40 border border-gray-600/50 rounded-xl text-gray-200 placeholder-gray-500 focus:outline-none focus:border-cyan-400/70 transition-all"
                            [class.border-red-500]="f['name'].touched && f['name'].invalid" />
                        <p *ngIf="f['name'].touched && f['name'].invalid" class="mt-1 text-sm text-red-400">
                            <span *ngIf="f['name'].errors?.['required']">Name is required.</span>
                            <span *ngIf="f['name'].errors?.['minlength']">Name must be at least 2 characters.</span>
                        </p>
                    </div>

                    <!-- Phone Number (Optional) -->
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1.5">
                            Phone Number <span class="text-gray-500 text-xs">(Optional)</span>
                        </label>
                        <input formControlName="phone" type="tel" placeholder="+1 (555) 123-4567"
                            class="w-full px-4 py-2.5 bg-gray-700/40 border border-gray-600/50 rounded-xl text-gray-200 placeholder-gray-500 focus:outline-none focus:border-cyan-400/70 transition-all" />
                    </div>

                    <!-- Message -->
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1.5">Message</label>
                        <textarea formControlName="message" rows="5" placeholder="Describe your issue or question..."
                            class="w-full px-4 py-2.5 bg-gray-700/40 border border-gray-600/50 rounded-xl text-gray-200 placeholder-gray-500 focus:outline-none focus:border-cyan-400/70 resize-none transition-all"
                            [class.border-red-500]="f['message'].touched && f['message'].invalid"></textarea>
                        <p *ngIf="f['message'].touched && f['message'].invalid" class="mt-1 text-sm text-red-400">
                            <span *ngIf="f['message'].errors?.['required']">Message is required.</span>
                            <span *ngIf="f['message'].errors?.['minlength']">Message must be at least 10
                                characters.</span>
                        </p>
                    </div>

                    <!-- Submit Button -->
                    <div>
                        <button type="submit" [disabled]="isSending || supportForm.invalid"
                            class="w-full py-3 bg-linear-to-r from-cyan-500 to-blue-500 hover:from-cyan-400 hover:to-blue-400 text-white font-bold rounded-xl disabled:opacity-50 transition-all">
                            {{ isSending ? 'Sending...' : 'Send Message' }}
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>
